name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Sync to S3 + Invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::995725180171:role/portfolio-site-production-github-deploy
          aws-region: ap-south-1

      - name: Sync site to S3
        run: |
          aws s3 sync . s3://portfolio-site-production-995725180171 \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude "terraform/*" \
            --exclude ".mcp.json" \
            --exclude "mcp.json" \
            --exclude "weather_flask_app-main/*" \
            --exclude "*.md" \
            --exclude "CLAUDE.md"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ETJHBX3HTJL47 \
            --paths "/*"
