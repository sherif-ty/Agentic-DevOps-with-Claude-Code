<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Check the current weather for any city.">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <span class="cloud" aria-hidden="true">☁️</span>

    <main class="container">
        <h1>⛅ CHECK WEATHER NOW!</h1>

        <form id="weather-form" autocomplete="off">
            <label for="city" class="visually-hidden">City name</label>
            <input type="text" id="city" name="city" placeholder="Enter city name" required>
            <button type="submit">GET WEATHER</button>
        </form>

        <section id="result" class="result" aria-live="polite">
            <h3 class="one">Please enter a city to get</h3>
            <h3 class="one">weather data</h3>
        </section>
    </main>

    <footer>
        Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    </footer>

    <script src="app.js"></script>
</body>
</html>
